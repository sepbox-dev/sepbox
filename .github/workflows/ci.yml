name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  engine-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sepbox
          POSTGRES_PASSWORD: sepbox
          POSTGRES_DB: sepbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Run Alembic database migrations
        working-directory: engine
        env:
          DATABASE_URL: postgresql+psycopg://sepbox:sepbox@localhost:5432/sepbox
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Run engine pytest suite
        working-directory: engine
        env:
          DATABASE_URL: postgresql+psycopg://sepbox:sepbox@localhost:5432/sepbox
          PYTHONPATH: .
        run: pytest -v