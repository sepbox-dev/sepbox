name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  engine-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sepbox
          POSTGRES_PASSWORD: sepbox
          POSTGRES_DB: sepbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Run Alembic database migrations
        working-directory: engine
        env:
          DATABASE_URL: postgresql+psycopg://sepbox:sepbox@localhost:5432/sepbox
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Run engine pytest suite
        working-directory: engine
        env:
          DATABASE_URL: postgresql+psycopg://sepbox:sepbox@localhost:5432/sepbox
          PYTHONPATH: .
        run: pytest -v

  contract-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v30.0.1

      - name: Run Soroban contract unit tests
        working-directory: contracts
        run: cargo test --verbose

      - name: Build Soroban WASM artifact
        working-directory: contracts
        run: stellar contract build

  inspector-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install inspector dependencies
        working-directory: inspector
        run: npm install --no-audit --no-fund

      - name: Build Next.js inspector
        working-directory: inspector
        env:
          NEXT_PUBLIC_ENGINE_URL: http://localhost:8000
        run: npm run build

      - name: Run TypeScript typecheck
        working-directory: inspector
        run: npm run typecheck
